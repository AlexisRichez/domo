# =========================
# Polices
# =========================
font:
  - file: "gfonts://Inter@700"
    id: my_default_font
    size: 30
  - file: "gfonts://Inter@700"
    id: my_default_font_big
    size: 104

# =========================
# Variables globales
# =========================
globals:
  - id: last_outside_temp
    type: float
    initial_value: '0.0'

  - id: last_outside_humidity
    type: float
    initial_value: '0.0'

  - id: last_living_temp
    type: float
    initial_value: '0.0'

  - id: last_living_humidity
    type: float
    initial_value: '0.0'

  - id: last_chamber_temp
    type: float
    initial_value: '0.0'

  - id: last_chamber_humidity
    type: float
    initial_value: '0.0'

  - id: last_bathroom_temp
    type: float
    initial_value: '0.0'

  - id: last_bathroom_humidity
    type: float
    initial_value: '0.0'

  - id: screen_updated
    type: bool
    initial_value: 'false'

# =========================
# Capteurs texte Home Assistant
# =========================
text_sensor:
  - platform: homeassistant
    entity_id: sensor.outside_details
    id: outside_details
    internal: true

  - platform: homeassistant
    entity_id: sensor.outside_icon
    id: outside_icon
    internal: true

# =========================
# Capteurs numériques Home Assistant
# =========================
sensor:
  - platform: homeassistant
    entity_id: sensor.living_room_temperature
    id: living_temp
    internal: true

  - platform: homeassistant
    entity_id: sensor.living_room_humidity
    id: living_humidity
    internal: true

  - platform: homeassistant
    entity_id: sensor.outside_temperature
    id: outside_temp
    internal: true
    on_value:
      then:
        - script.execute: refresh_screen

  - platform: homeassistant
    entity_id: sensor.outside_humidity
    id: outside_humidity
    internal: true

  - platform: homeassistant
    entity_id: sensor.chamber_temperature
    id: chamber_temp
    internal: true

  - platform: homeassistant
    entity_id: sensor.chamber_humidity
    id: chamber_humidity
    internal: true

  - platform: homeassistant
    entity_id: sensor.bathroom_temperature
    id: bathroom_temp
    internal: true

  - platform: homeassistant
    entity_id: sensor.bathroom_humidity
    id: bathroom_humidity
    internal: true

# =========================
# Heure Home Assistant
# =========================
time:
  - platform: homeassistant
    id: esptime

# =========================
# SPI
# =========================
spi:
  clk_pin: GPIO8
  mosi_pin: GPIO10

# =========================
# Écran ePaper
# =========================
display:
  - platform: waveshare_epaper
    id: epaper
    cs_pin: GPIO3
    dc_pin: GPIO5
    busy_pin:
      number: GPIO4
      inverted: true
    reset_pin: GPIO2
    model: 7.50inv2
    update_interval: never

    lambda: |-
      auto t = id(esptime).now();

      // =========================
      // Date
      // =========================
      if (t.year >= 2025 && t.month >= 1 && t.month <= 12) {
        const char* mois[12] = {
          "JANVIER", "FEVRIER", "MARS", "AVRIL",
          "MAI", "JUIN", "JUILLET", "AOUT",
          "SEPTEMBRE", "OCTOBRE", "NOVEMBRE", "DECEMBRE"
        };

        char date_buffer[64];
        snprintf(date_buffer, sizeof(date_buffer), "%02d %s %04d",
                 t.day_of_month, mois[t.month - 1], t.year);

        it.printf(40, 20, id(my_default_font), "%s", date_buffer);
      } else {
        it.printf(40, 20, id(my_default_font), "Connexion HA...");
      }

      // Séparation météo / pièces
      it.line(480, 60, 480, 420);

      // =========================
      // COLONNE GAUCHE : EXTÉRIEUR
      // =========================
      if (!isnan(id(outside_temp).state))
        id(last_outside_temp) = id(outside_temp).state;

      it.printf(40, 60, id(my_default_font_big),
                "%.1f°c", id(last_outside_temp));

      if (!isnan(id(outside_humidity).state))
        id(last_outside_humidity) = id(outside_humidity).state;

      it.printf(40, 170, id(my_default_font),
                "%.1f%%", id(last_outside_humidity));

      if (id(outside_details).has_state()) {
        it.printf(40, 200, id(my_default_font),
                  "%s", id(outside_details).state.c_str());
      }

      // Icône météo
      if (id(outside_icon).has_state()) {
        std::string key = "w" + std::string(id(outside_icon).state.c_str());

        if (key == "w01d") it.image(40, 250, id(w01d));
        else if (key == "w01n") it.image(40, 250, id(w01n));
        else if (key == "w02d") it.image(40, 250, id(w02d));
        else if (key == "w02n") it.image(40, 250, id(w02n));
        else if (key == "w03d") it.image(40, 250, id(w03d));
        else if (key == "w03n") it.image(40, 250, id(w03n));
        else if (key == "w04d") it.image(40, 250, id(w04d));
        else if (key == "w04n") it.image(40, 250, id(w04n));
        else if (key == "w09d") it.image(40, 250, id(w09d));
        else if (key == "w09n") it.image(40, 250, id(w09n));
        else if (key == "w10d") it.image(40, 250, id(w10d));
        else if (key == "w10n") it.image(40, 250, id(w10n));
        else if (key == "w11d") it.image(40, 250, id(w11d));
        else if (key == "w11n") it.image(40, 250, id(w11n));
        else if (key == "w13d") it.image(40, 250, id(w13d));
        else if (key == "w13n") it.image(40, 250, id(w13n));
        else if (key == "w50d") it.image(40, 250, id(w50d));
        else if (key == "w50n") it.image(40, 250, id(w50n));
      }

      // =========================
      // COLONNE DROITE : LES PIÈCES
      // =========================
      int x = 500;
      int y = 60;
      int line = 35;

      // Salon
      it.printf(x, y, id(my_default_font), "SALON");
      y += line;

      if (!isnan(id(living_temp).state))
        id(last_living_temp) = id(living_temp).state;

      it.printf(x, y, id(my_default_font),
                "%.1f°c", id(last_living_temp));
      y += line;

      if (!isnan(id(living_humidity).state))
        id(last_living_humidity) = id(living_humidity).state;

      it.printf(x, y, id(my_default_font),
                "%.1f%%", id(last_living_humidity));

      // Chambre
      y += line + 15;
      it.printf(x, y, id(my_default_font), "CHAMBRE");
      y += line;

      if (!isnan(id(chamber_temp).state))
        id(last_chamber_temp) = id(chamber_temp).state;

      it.printf(x, y, id(my_default_font),
                "%.1f°c", id(last_chamber_temp));
      y += line;

      if (!isnan(id(chamber_humidity).state))
        id(last_chamber_humidity) = id(chamber_humidity).state;

      it.printf(x, y, id(my_default_font),
                "%.1f%%", id(last_chamber_humidity));

      // Salle de bain
      y += line + 15;
      it.printf(x, y, id(my_default_font), "SALLE DE BAIN");
      y += line;

      if (!isnan(id(bathroom_temp).state))
        id(last_bathroom_temp) = id(bathroom_temp).state;

      it.printf(x, y, id(my_default_font),
                "%.1f°c", id(last_bathroom_temp));
      y += line;

      if (!isnan(id(bathroom_humidity).state))
        id(last_bathroom_humidity) = id(bathroom_humidity).state;

      it.printf(x, y, id(my_default_font),
                "%.1f%%", id(last_bathroom_humidity));

# =========================
# Actualisation écran
# =========================
script:
  - id: refresh_screen
    mode: restart
    then:
      # Attend que les états des capteurs aient le temps d'arriver
      - delay: 2s
      - component.update: epaper
